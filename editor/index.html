<!doctype html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>挪车接客 · 关卡编辑器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif;
            background: #1e2230; color: #e6e8ee; height: 100vh;
        }
        #app { display: grid; grid-template-columns: 220px 1fr 300px; height: 100vh; }
        aside, main { padding: 14px; overflow: auto; }
        #library { background: #262b3c; border-right: 1px solid #333a4f; }
        #inspector { background: #262b3c; border-left: 1px solid #333a4f; }
        h3 { margin: 4px 0 12px; font-size: 15px; color: #aab2c8; letter-spacing: 1px; }
        .lvitem { padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; background: #2f3650; }
        .lvitem:hover { background: #3a4260; }
        .lvitem.active { background: #4661c0; }
        p { margin: 6px 0; font-size: 14px; line-height: 1.5; }
        .ok { color: #6ad48c; }
        .bad { color: #ee6d6d; }
    </style>
</head>
<body>
    <div id="app">
        <aside id="library"><h3>关卡库</h3></aside>
        <main id="canvas"><h3>编辑区</h3></main>
        <aside id="inspector"><h3>属性 / 校验</h3></aside>
    </div>
    <script src="editor.js"></script>
</body>
</html>
